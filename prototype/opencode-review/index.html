<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark"><title>Veer · OpenCode 参考原型</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="style.css"><script type="module" src="app.mjs"></script>
</head>
<body>
  <div class="shell">
    <aside class="navigation" aria-label="配置导航">
      <div class="brand">Veer<span>.</span></div>
      <button class="nav-current" id="workbench"><span data-icon="chat"></span>AI 工作台</button>
      <div class="nav-label">当前配置</div><div id="sidebar-file" class="sidebar-file">尚未导入</div>
      <button id="draft-nav"><span data-icon="file"></span>规则稿</button>
      <button id="groups-nav"><span data-icon="route"></span>策略组</button>
      <div class="nav-bottom"><button id="settings"><span data-icon="settings"></span>AI 设置</button>
        <p>完整配置留在本机<br>AI 不接收节点或密钥</p><p class="demo-note">交互原型 · 合成数据</p></div>
    </aside>
    <main class="workspace">
      <header class="toolbar">
        <div class="document-identity"><strong id="file-title">AI 工作台</strong><span id="file-status">仅编辑规则 · 不控制代理</span></div>
        <div class="toolbar-actions">
          <button id="mobile-menu" class="icon-button glass mobile-only" aria-label="配置菜单" title="配置菜单"><span data-icon="settings"></span></button>
          <button id="import" class="icon-button glass" aria-label="导入配置" title="导入配置（⌘O）"><span data-icon="plus"></span></button>
          <button id="export" class="icon-button glass" aria-label="导出演示副本" title="导出演示副本" disabled><span data-icon="export"></span></button>
          <button id="review-toggle" class="icon-button glass" aria-label="打开修改审阅" aria-expanded="false" title="修改审阅" disabled><span data-icon="panel"></span></button>
          <button id="theme" class="icon-button glass" aria-label="切换深浅色" title="切换深浅色"><span data-icon="moon"></span></button>
        </div>
      </header>
      <div class="work-area">
        <section class="conversation" aria-label="对话工作台">
          <div id="timeline" class="timeline" tabindex="0" aria-label="对话历史">
            <section id="landing" class="landing"><button id="landing-import" class="import-plus glass" aria-label="导入配置文件或订阅链接"><span data-icon="plus"></span></button><h1>从一份配置开始</h1><p>导入配置文件或订阅链接以开始</p></section>
            <div id="messages"></div>
          </div>
          <button id="latest" class="latest glass" hidden><span data-icon="down"></span>回到最新</button>
          <div class="composer-wrap">
            <form id="composer" class="composer">
              <label class="sr-only" for="prompt">对话修改配置</label>
              <textarea id="prompt" rows="3" maxlength="1000" placeholder="导入配置文件或订阅链接以开始" disabled></textarea>
              <div class="composer-controls"><select id="mode" aria-label="解析模式" disabled><option>本地解析 · 演示</option><option>AI 理解 · 演示</option></select><span id="work-status" role="status"></span><button id="send" class="icon-button glass send" aria-label="发送指令" disabled><span data-icon="up"></span></button></div>
              <p>仅合成演示，不读取文件、不访问订阅或 AI。请勿输入真实密钥。</p>
            </form>
            <div class="demo-controls"><label>演示场景 <select id="scenario"><option value="normal">正常预览</option><option value="long">长文本</option><option value="error">请求失败</option></select></label><button id="reset">回到未导入首页</button></div>
          </div>
        </section>
        <section id="review" class="review" aria-labelledby="review-title" hidden>
          <header class="review-header"><div><h2 id="review-title">修改审阅</h2><span id="review-state">尚无候选</span></div><button id="review-close" class="icon-button" aria-label="返回对话"><span data-icon="close"></span></button></header>
          <div id="review-content" class="review-content"></div><div id="review-actions" class="review-actions"></div>
        </section>
      </div>
    </main>
  </div>
  <div id="toast" class="toast glass" role="status" hidden><span id="toast-text"></span><button id="toast-close" class="icon-button" aria-label="关闭提示"><span data-icon="close"></span></button></div>
  <dialog id="import-dialog" aria-labelledby="import-title"><header class="dialog-header"><h2 id="import-title">导入配置</h2><button id="import-close" class="icon-button" aria-label="关闭导入"><span data-icon="close"></span></button></header><p>本原型只载入内置示例，不读取你的文件，也不下载订阅。</p><button id="sample-file" class="import-option"><span data-icon="file"></span><span><strong>从文件导入 · 演示</strong><small>载入 veer-demo.yaml 合成配置</small></span><span data-icon="right"></span></button><div class="url-demo"><label for="url">从 URL 导入 · 演示</label><input id="url" value="https://example.invalid/veer-demo.yaml" readonly><small>固定示例地址，不发送网络请求</small><button id="sample-url" class="primary">载入订阅示例</button></div></dialog>
  <dialog id="info-dialog" aria-labelledby="info-title"><header class="dialog-header"><h2 id="info-title"></h2><button id="info-close" class="icon-button" aria-label="关闭"><span data-icon="close"></span></button></header><div id="info-content"></div></dialog>
</body></html>
