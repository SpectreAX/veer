# Veer iOS prototype sample profile: every node goes out DIRECT, there are no servers, passwords
# or subscription links. Safe to import in the Simulator; traffic leaves through the Mac's own
# network, exactly as without Veer. Veer replaces the ports and the controller when it starts.
mode: rule
log-level: info

proxies:
  - name: "Direct A"
    type: direct
    udp: true
  - name: "Direct B"
    type: direct
    udp: true

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - "Direct A"
      - "Direct B"
      - "Auto"
      - DIRECT
  - name: "Auto"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    proxies:
      - "Direct A"
      - "Direct B"

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,Proxy
